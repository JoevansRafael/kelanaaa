<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kelana — explainer</title>
<style>
@font-face{font-family:PJS;src:url(assets/PlusJakartaSans.ttf) format('truetype');font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F8FAFC}
body{font-family:PJS,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#F8FAFC}
#camwrap{position:absolute;left:0;top:0;width:1920px;height:1080px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.layer{position:absolute;left:0;top:0}
#hook,#caps,#pay,#end,#sA,#sB,#sC,#sD{width:1920px;height:1080px}
.abs{position:absolute}
.bg{position:absolute;background:#fff;border:1px solid #E2E8F0;border-radius:20px}
.m{overflow:hidden;display:block;padding:0 .04em .14em;margin:0 -.04em -.14em}
.mi{display:block;white-space:nowrap}
.t{position:absolute;white-space:nowrap}
.h{font-weight:700}
.sl{color:#64748B}
.k{color:#35A8FF}
.chip{position:absolute;height:28px;padding:0 12px;border-radius:14px;background:#F1F5F9;font-size:13px;font-weight:600;line-height:28px;white-space:nowrap}
.ico{position:absolute;width:40px;height:40px;border-radius:11px;background:#F1F5F9;display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px;fill:none;stroke:#0F172A;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile{position:absolute;width:240px;height:136px;border-radius:16px;background:#fff;border:1px solid #E2E8F0}
.stamp{position:absolute;width:24px;height:24px;border-radius:12px;background:#0F172A;display:flex;align-items:center;justify-content:center}
.stamp svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.node{position:absolute;width:16px;height:16px;border-radius:8px;border:2.5px solid #94A3B8;background:#F8FAFC}
.roll{position:relative;display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.roll .ra,.roll .rb{display:block}
.roll .rb{position:absolute;left:0;top:0}
.seat{position:absolute;width:40px;height:40px;border-radius:20px;font-size:13px;font-weight:700;color:#fff;background:#0F172A;display:flex;align-items:center;justify-content:center}
.seat.e{background:transparent;border:2px dashed #CBD5E1}
.seat .f{position:absolute;inset:-2px;border-radius:20px;background:#334155}
.row{position:absolute;width:312px;height:48px;border-radius:12px;border:1.5px solid #E2E8F0;background:#fff}
.row .l{position:absolute;left:14px;top:13px;font-size:15px;color:#64748B}
.row .p{position:absolute;right:14px;top:12px;font-size:16px;font-weight:700}
.cap{position:absolute;left:112px;width:640px}
.cap .eb{font-size:17px;font-weight:700;letter-spacing:.14em;color:#64748B;margin-bottom:18px}
.cap .ln{font-size:66px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
#cur{position:absolute;left:0;top:0;width:34px;height:34px;transform-origin:3px 3px}
#dot{position:absolute;background:#35A8FF}
#logo{position:absolute;background:#35A8FF;-webkit-mask:url(assets/logo.png) 0 0/100% 100% no-repeat;mask:url(assets/logo.png) 0 0/100% 100% no-repeat}
.pay{position:absolute;left:0;width:1920px;text-align:center;color:#fff;font-weight:800;letter-spacing:-.04em}
.pay .m{display:inline-block}
.endt{position:absolute;left:0;width:1920px;text-align:center}
.endt .m{display:inline-block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="fDot" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur id="gDot" stdDeviation="0 0"/></filter>
  <filter id="fCur" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCur" stdDeviation="0 0"/></filter>
  <filter id="fCard" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCard" stdDeviation="0 0"/></filter>
  <filter id="fCam" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCam" stdDeviation="0 0" edgeMode="duplicate"/></filter>
</svg>
<div id="stage">
  <div id="camwrap"><div id="world"></div></div>
  <div id="hook" class="layer"></div>
  <div id="caps" class="layer"></div>
  <div id="pay" class="layer"></div>
  <div id="end" class="layer"></div>
  <svg id="cur" viewBox="0 0 34 34"><path d="M3 3 L3 27 L9.5 21 L13.6 30.4 L17.6 28.7 L13.6 19.6 L22.5 19.6 Z" fill="#0F172A" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
<script>
'use strict';
/* =========================================================================
   Kelana explainer. 1920x1080, 120 BPM. Every style is a pure function of t
   applied inside window.seek(t). No CSS animations, no timers, no state
   carried between frames (all caches are built once at load, before t).
   ========================================================================= */
const ACC = '#35A8FF';
const DUR = 56;
const CUTS = [8, 14, 26];               // hard match cuts (camera re-anchors on the dot)
const SCENES = [0, 2, 8, 14, 26, 40, 46, 56]; // push 1.00 -> 1.04 inside each

/* ---------- easing, all functions of normalised time ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, t0, d) => clamp((t - t0) / d);
const E = {
  lin: p => p,
  expo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  expoIn: p => (p <= 0 ? 0 : (Math.pow(2, 10 * p) - 1) / 1023),
  expoio: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? (Math.pow(2, 20 * p - 10)) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  inout: p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  in: p => p * p * p,
  // damped spring step response, zeta ~0.75 => ~2.8% overshoot, settles by p~0.7
  spring: p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-8 * p) * (Math.cos(7.06 * p) + (8 / 7.06) * Math.sin(7.06 * p))),
  step: p => (p > 0 ? 1 : 0),
};
const SPR = E.spring;
const bump = (t, t0, up = .12, down = .35) => (t < t0 ? 0 : t < t0 + up ? E.expo((t - t0) / up) : 1 - E.inout(seg(t, t0 + up, down)));

/* ---------- small DOM helpers ---------- */
const $ = id => document.getElementById(id);
const world = $('world');
function html(parent, s) { parent.insertAdjacentHTML('beforeend', s); }
const IC = {
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  camera: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8.5 7l1.5-3h4l1.5 3"/>',
  food: '<path d="M7 3v18M4.5 3v5.5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2.2 1.6-3 4.6-3 9h3"/>',
  bed: '<path d="M3 19V7M3 15h18v4M21 15v-2.5a3 3 0 0 0-3-3h-7V15"/><circle cx="7" cy="12" r="1.7"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  check: '<path d="M6 12.5l4 4 8-9"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
};
const svg = (n, extra = '') => `<svg viewBox="0 0 24 24" ${extra}>${IC[n]}</svg>`;
// single-line text with an optional reveal: fx up (mask rise)
const T = (x, y, txt, st = '', inn = null, out = null, extra = '') =>
  `<div class="t" style="left:${x}px;top:${y}px;${st}" ${inn != null ? `data-in="${inn}"` : ''} ${out != null ? `data-out="${out}"` : ''} data-fx="up" ${extra}>${txt}</div>`;
const roll = (id, a) => `<span class="roll" id="${id}"><span class="ra">${a}</span><span class="rb">${a}</span></span>`;

/* =========================================================================
   SCENE A — Penyusun itinerary (budget slider + minat grid + button)
   ========================================================================= */
html(world, `<div class="layer" id="sA">
  <div class="bg" id="bBg" style="left:0;top:0;width:800px;height:204px" data-in="2.0" data-fx="unfold" data-oy="0.49" data-r="20"></div>
  ${T(28, 26, 'Budget per orang', 'font-size:24px;font-weight:700', 2.15)}
  <div class="t" id="bVal" style="right:${1920 - 772}px;top:26px;font-size:24px;font-weight:700;text-align:right" data-in="2.25" data-fx="up">Rp 15 jt</div>
  <div class="abs" id="bTrack" style="left:30px;top:96px;width:740px;height:8px;border-radius:4px;background:#E2E8F0;transform-origin:0 50%"></div>
  ${T(28, 124, 'Rp 500 rb', 'font-size:14px;color:#94A3B8', 2.35)}
  <div class="t" style="right:${1920 - 772}px;top:124px;font-size:14px;color:#94A3B8" data-in="2.4" data-fx="up">Rp 15 jt</div>
  ${T(28, 160, 'Belum termasuk tiket pesawat. Kelana bakal nyusun rencana yang pas di angka ini.', 'font-size:16px;color:#64748B', 4.5)}

  <div class="bg" id="mBg" style="left:0;top:250px;width:800px;height:430px" data-in="4.5" data-fx="clipY" data-r="20"></div>
  ${T(28, 276, 'Apa yang bikin kamu semangat?', 'font-size:24px;font-weight:700', 4.6)}
  ${T(28, 314, 'Pilih minimal 2. Ini yang nentuin aktivitas apa yang masuk rencana', 'font-size:15px;color:#64748B', 4.7)}
  <div id="tiles"></div>
  ${T(30, 731, 'Kembali', 'font-size:17px;font-weight:700', 6.8)}
  <div class="abs" id="susun" style="left:520px;top:712px;width:280px;height:60px;border-radius:30px;background:#0F172A" data-in="6.75" data-fx="growX" ></div>
  <div class="t" style="left:584px;top:729px;font-size:18px;font-weight:700;color:#fff" data-in="6.9" data-fx="up">Susun rencana saya</div>
</div>`);
const TILES = [
  ['globe', 'Budaya & sejarah', 'Kampung adat, museum'],
  ['camera', 'Pemandangan alam', 'Bukit, pantai, air terjun'],
  ['food', 'Kuliner lokal', 'Warung, pasar malam'],
  ['bed', 'Santai & istirahat', 'Ngak mau dikejar waktu'],
  ['sun', 'Sunrise & sunset', 'Siap bangun subuh'],
  ['compass', 'Snorkeling Laut', 'Terumbu, pulau kecil'],
];
const PICK = [1, 4, 5];               // the three real selections in the Figma
const PICK_T = [5.5, 6.0, 6.5];       // click times (on the beat)
TILES.forEach(([ic, a, b], i) => {
  const x = 24 + (i % 3) * 256, y = 358 + Math.floor(i / 3) * 152, tin = 4.8 + i * 0.06;
  html($('tiles'), `<div class="tile" id="tile${i}" style="left:${x}px;top:${y}px" data-in="${tin}" data-fx="clipY" data-r="16"></div>
   <div class="ico" style="left:${x + 20}px;top:${y + 20}px" data-in="${tin + .1}" data-fx="grow">${svg(ic)}</div>
   ${T(x + 20, y + 76, a, 'font-size:16px;font-weight:700', tin + .14)}
   ${T(x + 20, y + 102, b, 'font-size:13px;color:#64748B', tin + .18)}
   <div class="stamp" id="stamp${i}" style="left:${x + 240 - 38}px;top:${y + 14}px">${svg('check')}</div>`);
});

/* =========================================================================
   SCENE B — Rencana siap + estimasi biaya
   ========================================================================= */
const COST = [['Kapal & kru', 2.09, '2,09 jt', '#0F172A'], ['Tiket & ranger', .92, '920 rb', '#334155'], ['Makan', .78, '780 rb', '#64748B'], ['Penginapan', .63, '630 rb', '#94A3B8'], ['Lain-lain', .435, '435 rb', '#CBD5E1']];
const BAR = { x: 24, y: 272, w: 632, h: 10 };
html(world, `<div class="layer" id="sB">
  <div class="bg" style="left:0;top:0;width:680px;height:136px;background:#F1F5F9;border-color:#F1F5F9" data-in="8.05" data-out="13.45" data-fx="unfold" data-oy=".5" data-r="20"></div>
  <div class="abs" id="spark" style="left:34px;top:58px;width:20px;height:20px"></div>
  ${T(84, 30, 'Rencana 4 hari kamu sudah siap', 'font-size:22px;font-weight:700', 8.45, 13.4)}
  ${T(84, 68, 'Disusun dari 11 aktivitas yang cocok sama minatmu, dengan estimasi', 'font-size:16px;color:#64748B', 8.6, 13.4)}
  ${T(84, 92, '<b style="color:#0F172A">Rp 4,85 jt per orang</b> — masih di bawah budget.', 'font-size:16px;color:#64748B', 8.7, 13.4)}
  <div class="bg" style="left:0;top:166px;width:680px;height:410px" data-in="9.0" data-out="13.5" data-fx="clipY" data-r="20"></div>
  ${T(24, 190, 'Estimasi biaya', 'font-size:22px;font-weight:700', 9.1, 13.5)}
  ${T(24, 232, 'Total per orang', 'font-size:14px;color:#64748B', 9.2, 13.5)}
  <div class="t" id="eTot" style="right:${1920 - 656}px;top:218px;font-size:32px;font-weight:800;letter-spacing:-.02em" data-in="9.5" data-out="13.5" data-fx="up">Rp 0,00 jt</div>
  <div class="abs" id="eTrack" style="left:${BAR.x}px;top:${BAR.y}px;width:${BAR.w}px;height:${BAR.h}px;border-radius:5px;background:#EEF2F6;overflow:hidden;transform-origin:0 50%" data-in="9.2" data-out="13.55" data-fx="growX"></div>
  ${T(24, 294, 'Budget kamu Rp 5,00 jt — sisa Rp 150 rb', 'font-size:13px;color:#64748B', 12.5, 13.5)}
  <div class="t" style="right:${1920 - 656}px;top:190px;font-size:13px;font-weight:600;background:#F1F5F9;border-radius:13px;padding:4px 12px" data-in="12.1" data-out="13.5" data-fx="grow">Di bawah budget</div>
  <div id="eRows"></div>
</div>`);
COST.forEach(([l, v, s, c], i) => {
  const y = 330 + i * 46, tin = 9.5 + i * .5;
  html($('eTrack'), `<div class="abs" id="seg${i}" style="top:0;height:${BAR.h}px;background:${c}"></div>`);
  html($('eRows'), `<div class="abs" style="left:24px;top:${y + 18}px;width:10px;height:10px;border-radius:3px;background:${c}" data-in="${tin}" data-out="13.5" data-fx="grow"></div>
   ${T(46, y + 11, l, 'font-size:16px', tin + .05, 13.5)}
   <div class="t" style="right:${1920 - 656}px;top:${y + 11}px;font-size:16px;font-weight:700" data-in="${tin + .1}" data-out="13.5" data-fx="up">${s}</div>
   ${i < 4 ? `<div class="abs" style="left:24px;top:${y + 45}px;width:632px;height:1px;background:#EEF2F6;transform-origin:0 0" data-in="${tin + .1}" data-out="13.5" data-fx="growX"></div>` : ''}`);
});

/* =========================================================================
   SCENE C — Rencana harian: timeline, impossible gap, drag to Hari 3
   ========================================================================= */
const CARDS = [
  ['07.30', 'padar.jpg', 'Trekking sunrise Pulau Padar', '800 anak tangga, 45 menit naik. Berangkat gelap biar sepi.', ['Wajib', '3,5 jam', 'Rp 0']],
  ['11.00', 'pink_beach.jpg', 'Pink Beach — snorkeling & sarapan', 'Terumbu dangkal dekat pantai, aman buat pemula.', ['2 jam', 'Makan termasuk']],
  ['13.00', 'komodo.jpg', 'Pulau Komodo — trekking ditemani ranger', 'Rute pendek 1,5 km. Tiket taman nasional sudah termasuk.', ['Ranger wajib', 'Rp 320 rb']],
  ['15.30', 'manta.jpg', 'Manta Point — berenang bareng pari manta', 'Arus lebih tenang jam ini. Peluang lihat manta ±70%.', ['Tergantung cuaca', '1,5 jam']],
];
const CY = i => 184 + i * 148;   // card top
const SHIFT = 40;                // Komodo card drops to open the 75-minute gap
html(world, `<div class="layer" id="sC">
  <div class="abs" id="tabs" style="left:0;top:0;width:356px;height:52px;border-radius:26px;background:#EEF2F6" data-in="14.1" data-out="25.0" data-fx="clipX" data-r="26"></div>
  <div class="abs" style="left:96px;top:6px;width:84px;height:40px;border-radius:20px;background:#fff" data-in="14.2" data-out="25.0" data-fx="grow"></div>
  ${T(24, 15, 'Hari 1', 'font-size:16px;font-weight:600;color:#64748B', 14.2, 25.0)}
  ${T(110, 15, 'Hari 2', 'font-size:16px;font-weight:700', 14.25, 25.0)}
  <div class="t" id="tab3" style="left:196px;top:15px;font-size:16px;font-weight:600;color:#64748B" data-in="14.3" data-out="25.0" data-fx="up">Hari 3</div>
  ${T(280, 15, 'Hari 4', 'font-size:16px;font-weight:600;color:#64748B', 14.35, 25.0)}
  <div class="bg" style="left:0;top:76px;width:820px;height:84px;background:#F1F5F9;border-color:#F1F5F9;border-radius:18px" data-in="14.0" data-out="25.05" data-fx="unfold" data-oy=".5" data-r="18"></div>
  <div class="abs" style="left:16px;top:92px;width:52px;height:52px;border-radius:12px;background:#0F172A;color:#fff;text-align:center" data-in="14.1" data-out="25.05" data-fx="grow"><div style="font-size:10px;font-weight:700;letter-spacing:.1em;margin-top:7px">HARI</div><div style="font-size:22px;font-weight:800;line-height:24px">2</div></div>
  ${T(86, 94, 'Padar, Pink Beach & Komodo', 'font-size:22px;font-weight:700', 14.15, 25.05)}
  <div class="t" style="left:86px;top:126px;font-size:14px;color:#64748B" data-in="14.25" data-out="25.05" data-fx="up">Kam, 13 Nov · ${roll('rAct', '4')} aktivitas</div>
  <div class="abs" id="tLine" style="left:11px;top:220px;width:2px;height:0;background:#CBD5E1;transform-origin:0 0"></div>
  <div id="tCards"></div>
  <div class="abs" id="transit" style="left:40px;top:466px;width:780px;height:44px;border-radius:14px;border:1.5px dashed #CBD5E1;background:#F8FAFC" data-in="22.1" data-out="25.1" data-fx="clipX" data-r="14"></div>
  ${T(64, 478, 'Pindah pulau · <b style="color:#0F172A">75 menit berlayar</b> ke Pulau Komodo', 'font-size:15px;color:#64748B', 22.25, 25.1)}
  <div class="bg" id="warn" style="left:40px;top:776px;width:780px;height:124px;border-color:#CBD5E1;border-width:1.5px;border-radius:18px" data-in="18.0" data-out="22.5" data-fx="clipY" data-r="18"></div>
  <div class="abs" style="left:64px;top:800px;width:24px;height:24px" data-in="18.1" data-out="22.45" data-fx="grow">${svg('alert', 'style="width:24px;height:24px;fill:none;stroke:#0F172A;stroke-width:2;stroke-linecap:round"')}</div>
  ${T(100, 801, 'Satu hal yang perlu kamu cek', 'font-size:17px;font-weight:700', 18.15, 22.4)}
  ${T(64, 838, 'Perpindahan Pink Beach ke Pulau Komodo butuh sekitar <b style="color:#0F172A">75 menit berlayar</b>, tapi jadwalmu', 'font-size:15px;color:#475569', 18.5, 22.35)}
  ${T(64, 862, 'cuma menyisakan <b style="color:#0F172A">0 menit</b>. Kelana saranin geser Manta Point ke Hari 3.', 'font-size:15px;color:#475569', 18.6, 22.35)}
</div>`);
CARDS.forEach(([tm, img, title, desc, chips], i) => {
  const y = CY(i), tin = 14.5 + i * .5;
  const timeHtml = i === 2 ? [...'13.00'].map((c, j) => roll('tk' + j, c)).join('') : tm;
  let cx = 204, ch = '';
  chips.forEach((c, j) => { ch += `<div class="chip" style="left:${cx}px;top:84px" data-in="${tin + .22 + j * .05}" data-out="25.2" data-fx="grow">${c}</div>`; cx += c.length * 7.4 + 34; });
  html($('tCards'), `<div class="node" id="node${i}" style="left:4px;top:${y + 28}px"></div>
  <div class="abs" id="card${i}" style="left:40px;top:${y}px;width:780px;height:124px">
    <div class="bg" id="cardbg${i}" style="left:0;top:0;width:780px;height:124px;border-radius:18px" data-in="${tin}" data-out="${25.05 + i * .04}" data-fx="clipX" data-r="18"></div>
    <div class="t" style="left:24px;top:24px;font-size:18px;font-weight:700" data-in="${tin + .05}" data-out="25.1" data-fx="up">${timeHtml}</div>
    <div class="abs" style="left:96px;top:22px;width:80px;height:80px;border-radius:12px;overflow:hidden" data-in="${tin + .08}" data-out="25.1" data-fx="clipX" data-r="12"><img src="assets/${img}" style="width:100%;height:100%;object-fit:cover"></div>
    ${T(204, 22, title, 'font-size:19px;font-weight:700', tin + .12, 25.1)}

let REV = [];
function initReveals() {

    if (r.fx === 'up') {
      if (!el.classList.contains('m')) { el.innerHTML = `<span class="mi">${el.innerHTML}</span>`; el.classList.add('m'); }
      else if (!el.querySelector(':scope > .mi')) el.innerHTML = `<span class="mi">${el.innerHTML}</span>`;
      r.inner = el.querySelector(':scope > .mi');
    }
    if (r.fx === 'growX') el.style.transformOrigin = el.style.transformOrigin || '0 50%';
    REV.push(r);
  });
}
function applyRev(r, t) {
  const pin = r.tin == null ? 1 : SPR(seg(t, r.tin, .6));
  const pout = r.tout == null ? 0 : E.expoIn(seg(t, r.tout, .32));
  const el = r.el;
  if ((r.tin != null && t <= r.tin) || pout >= 1) { el.style.visibility = 'hidden'; return; }
  el.style.visibility = '';
  const v = clamp(pin) * (1 - pout);
  switch (r.fx) {
    case 'up': r.inner.style.transform = `translateY(${((1 - pin) - pout) * 118}%)`; break;
    case 'clipY': el.style.clipPath = `inset(0 0 ${(1 - v) * 100}% 0 round ${r.r}px)`; break;
    case 'clipX': el.style.clipPath = `inset(0 ${(1 - v) * 100}% 0 0 round ${r.r}px)`; break;
    case 'unfold': { const H = r.h, o = r.oy * H; el.style.clipPath = `inset(${o * (1 - v)}px 0 ${(H - o) * (1 - v)}px 0 round ${r.r}px)`; break; }
    case 'grow': el.style.transform = `scale(${Math.max(0, pin) * (1 - pout)})`; break;
    case 'growX': el.style.transform = `scaleX(${Math.max(0, pin) * (1 - pout)})`; break;
  }
}
// odometer: sched = [[t, value], ...]
function rollTo(id, sched, t) {
