.ibox svg{width:20px;height:20px;fill:none;stroke:#35A8FF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hook{position:absolute;font-size:118px;font-weight:800;letter-spacing:-.045em;line-height:1}
#cap{position:absolute;left:64px;top:946px;height:70px;border-radius:35px;background:#0F172A;overflow:hidden;transform-origin:0 50%}
#capt{position:absolute;left:64px;top:946px;height:70px;color:#fff;font-size:27px;font-weight:700;line-height:70px;letter-spacing:-.01em}
#capt .c{position:absolute;left:32px;top:0;white-space:nowrap}
#capt .c .mi{display:block}
#cur{position:absolute;left:0;top:0;width:38px;height:38px;transform-origin:3px 3px}
.bub{position:absolute;border-radius:12px;font-size:13.5px;line-height:18px;padding:11px 18px;white-space:nowrap}
#top{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:100;pointer-events:none}
.q{position:absolute;font-size:104px;font-weight:800;letter-spacing:-.045em;line-height:1}
.k{color:#35A8FF}
.pr{position:absolute;color:#fff;font-weight:800;letter-spacing:-.04em;line-height:1.08;font-size:84px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="fCur" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCur" stdDeviation="0 0"/></filter>
  <filter id="fCard" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCard" stdDeviation="0 0"/></filter>
  <filter id="fCam" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCam" stdDeviation="0 0" edgeMode="duplicate"/></filter>
</svg>
<div id="stage"></div>
<div id="top"></div>
<script>
'use strict';
/* =====================================================================
   Kelana explainer v3 — 60 s, 120 BPM. Pure function of t in seek(t).
   Pages are the Figma exports (1 world unit = 1 px of a 1280-wide page).
   Moving parts are vector layers or sprites cut from the same export.
   ===================================================================== */
const DUR = 60;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, t0, d) => clamp((t - t0) / d);
const E = {
  lin: p => p,
  expo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  expoIn: p => (p <= 0 ? 0 : (Math.pow(2, 10 * p) - 1) / 1023),
  expoio: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  inout: p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  in: p => p * p * p,
  spring: p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-8 * p) * (Math.cos(7.06 * p) + (8 / 7.06) * Math.sin(7.06 * p))),
};
const SPR = E.spring;
const bump = (t, t0, up = .1, down = .3) => (t < t0 ? 0 : t < t0 + up ? E.expo((t - t0) / up) : 1 - E.inout(seg(t, t0 + up, down)));
const $ = id => document.getElementById(id);
const add = (el, s) => el.insertAdjacentHTML('beforeend', s);
const IC = {
  camera: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8.5 7l1.5-3h4l1.5 3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  route: '<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
  check: '<path d="M6 12.5l4 4 8-9"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-4 4.2-6 7.5-6s6.3 2 7.5 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
};
const svg = (n, st) => `<svg viewBox="0 0 24 24" style="${st}">${IC[n]}</svg>`;

/* ---------- windows (one per screen); each has its own camera ---------- */
const WINS = {};   // id -> {el, world, t0, t1, cam:[...], origin}
const ORDER = [];
function win(id, t0, t1, opts = {}) {
  add($('stage'), `<div class="win" id="w_${id}"><div class="world" id="wd_${id}"></div></div>`);
  const w = { id, t0, t1, el: $('w_' + id), world: $('wd_' + id), cam: null, screen: !!opts.screen, img: opts.img, bg: opts.bg };
  if (opts.img) add(w.world, `<img class="page" src="assets/scr/${opts.img}.jpg">`);
  if (opts.screen) { w.world.style.width = '1920px'; w.world.style.height = '1080px'; }
  if (opts.bg) w.el.style.background = opts.bg;
  WINS[id] = w; ORDER.push(w); return w;
}
const spr = (img, x, y, w, h, id = '', extra = '') => `<div class="spr" ${id ? `id="${id}"` : ''} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(assets/scr/${img}.jpg);background-size:1280px auto;background-position:${-x}px ${-y}px;${extra}"></div>`;
const patch = (x, y, w, h, c, id = '', extra = '') => `<div class="patch" ${id ? `id="${id}"` : ''} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};${extra}"></div>`;

/* ======================= W0 HOOK (screen space) ======================= */
const hook = win('hook', 0, 6.0, { screen: true });
const HW = [ // word, line, in, out
  ['Mau', 0, 0.0, 2.2], ['liburan,', 0, 0.5, 2.25], ['malah', 1, 1.0, 2.3], ['bingung?', 1, 1.5, 2.35],
  ['Ujung-ujungnya', 2, 2.5, 4.2], ['malah', 3, 3.0, 4.25], ['gajadi', 3, 3.25, 4.3], ['<span id="lib">liburan?</span>', 3, 3.5, 4.35],
  ['Dibuat', 4, 4.5, 5.75], ['gampang', 4, 4.75, 5.8], ['di', 5, 5.0, 5.8], ['<span id="hlogoSlot" style="display:inline-block;width:326px;height:96px"></span>', 5, 5.25, null], ['aja!', 5, 5.25, 5.85],
];
{
  const LYH = [372, 508, 372, 508, 372, 508];
  let h = '';
  [0, 1, 2, 3, 4, 5].forEach(L => {
    h += `<div class="hook" style="left:216px;top:${LYH[L]}px" id="hl${L}">` + HW.map((w, i) => w[1] === L ? `<span class="m" id="hw${i}"><span class="mi">${w[0]}</span></span> ` : '').join('') + '</div>';
  });
  add(hook.world, h);
  add(hook.world, `<div class="abs" id="strike" style="height:10px;background:#0F172A;border-radius:5px;transform-origin:0 50%"></div>`);
}
add($('top'), `<img id="hlogo" src="assets/logo.png" style="position:absolute;left:0;top:0;width:326px;transform-origin:0 0;display:none">`);

/* ======================= W1 LANDING ======================= */

`);

add(s2.world, `<div class="abs" id="c3" style="left:62px;top:890px;width:776px;height:85px;background:#fff">
  <div class="tile" style="left:3px;top:3px;width:770px;height:79px;border-radius:12px"></div>
  <div class="abs" style="left:24px;top:19px;width:48px;height:48px;border-radius:10px;background:#EEF2F6;display:flex;align-items:center;justify-content:center">${svg('route', 'width:22px;height:22px;fill:none;stroke:#334155;stroke-width:1.8;stroke-linecap:round')}</div>

const PICK_T = [16.5, 17.0, 17.5, 18.5];

/* ======================= LOADING (screen space) ======================= */
const ld = win('loading', 19.5, 21.0, { screen: true });
add(ld.world, `
  <svg class="abs" id="spin" viewBox="0 0 100 100" style="left:${960 - 52}px;top:${430 - 52}px;width:104px;height:104px">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#E2E8F0" stroke-width="9"/>

  <div class="t" style="left:0;width:1920px;text-align:center;top:604px;font-size:24px;color:#64748B"><span class="m" id="ld1"><span class="mi">Hitung waktu tempuh, jam buka & biaya per pos</span></span></div>
  <div class="abs" style="left:${960 - 240}px;top:668px;width:480px;height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden" id="ldTrack"><div class="abs" id="ldBar" style="left:0;top:0;height:8px;width:480px;background:#0F172A;transform-origin:0 50%"></div></div>
`);

/* ======================= W4 SUSUN 3 (+ drag & drop) ======================= */
const s3 = win('susun3', 21.0, 27.5, { img: 'susun3' });
const COST = [[2.09, '#35A8FF'], [.92, '#3B7FC4'], [.78, '#FF7A45'], [.63, '#F5A524'], [.435, '#CBD5E1']];
add(s3.world, `
  ${patch(920, 337, 300, 19, '#fff')}
  <div class="abs" id="eTrack" style="left:925px;top:341px;width:290px;height:11px;border-radius:6px;background:#E8EEF5;overflow:hidden">${COST.map((c, i) => `<div class="abs" id="seg${i}" style="top:0;height:11px;background:${c[1]}"></div>`).join('')}</div>
  ${patch(1080, 300, 140, 36, '#fff')}
  <div class="t" id="eTot" style="right:${1280 - 1214}px;top:302px;font-size:23px;font-weight:800;letter-spacing:-.02em">Rp 0,00 jt</div>
  ${patch(120, 616, 330, 26, '#EAF4FE', 'actCover')}
  <div class="t" style="left:125px;top:619px;font-size:14px;color:#64748B">Kam, 13 Nov · <span class="m"><span class="mi" id="actN">4 aktivitas · 11 jam 30 menit</span></span></div>
  ${patch(0, 1066, 880, 533, '#F8FAFC')}
  ${spr('susun3', 30, 1198, 840, 74, 'sTambah')}
  <div class="abs" id="sWarnClip" style="left:30px;top:1290px;width:840px;height:192px;overflow:hidden">${spr('susun3', 30, 1290, 840, 192, '', 'left:0;top:0')}</div>
  ${spr('susun3', 30, 1500, 840, 72, 'sBtns')}
  ${spr('susun3', 36, 1068, 830, 130, 'sManta', 'border-radius:16px')}
`);
document.querySelector('#sWarnClip .spr').style.backgroundPosition = '-30px -1290px';

/* ======================= INTERSTITIALS (screen space) ======================= */
function quote(id, t0, t1, a, b) {
  const w = win(id, t0, t1, { screen: true });
  const L = (txt, y, k) => `<div class="q" style="left:216px;top:${y}px"><span class="m" id="${id}_${k}"><span class="mi">${txt}</span></span></div>`;
  add(w.world, L(a[0], 400, 0) + L(a[1], 524, 1) + L(b[0], 400, 2) + L(b[1], 524, 3));
  return w;
}
const qf = quote('qForum', 27.5, 30.5, ['Butuh review atau', 'pengalaman orang lain?'], ['Tenang, kamu bisa', 'ngobrol di <span class="k" id="qfK">forum!</span>']);
const QF = [27.75, 28.0, 29.4, 29.65], QFO = [29.05, 29.1];

/* ======================= W5 FORUM ======================= */
const fo = win('forum', 30.5, 36.5, { img: 'forum' });
add(fo.world, `
  ${patch(440, 1146, 700, 30, '#F8FAFC', 'fCover')}
  <div class="t" id="fType" style="left:446px;top:1151px;font-size:15px"></div>
  ${patch(418, 556, 826, 556, '#fff', 'chatPatch')}
  <div class="abs" id="chatClip" style="left:418px;top:556px;width:826px;height:556px;overflow:hidden">
    <div class="abs" id="chatMove" style="left:0;top:0;width:826px;height:900px">
      ${spr('forum', 418, 556, 826, 556, '', 'left:0;top:0')}
      <div class="t" id="kamuL" style="right:${826 - 790}px;top:${1124 - 556}px;font-size:10px;color:#64748B">Kamu</div>
      <div class="bub" id="kamuB" style="right:${826 - 790}px;top:${1140 - 556}px;background:#35A8FF;color:#fff;font-size:13.5px;font-weight:600;transform-origin:100% 100%">Ada yang mau bareng ke Blok M sore ini?</div>
      <div class="abs" id="jrA" style="left:${429 - 418}px;top:${1196 - 556}px;width:52px;height:52px;border-radius:10px;background:#3B4A63;display:flex;align-items:center;justify-content:center">${svg('user', 'width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8')}</div>
      <div class="t" id="jrN" style="left:${494 - 418}px;top:${1196 - 556}px;font-size:11px;font-weight:700">Joevans Rafa</div>
      <div class="bub" id="jrT" style="left:${493 - 418}px;top:${1216 - 556}px;background:#F1F5F9;width:78px;height:40px;transform-origin:0 0">
        <i id="d0" class="abs" style="left:20px;top:17px;width:7px;height:7px;border-radius:4px;background:#64748B"></i><i id="d1" class="abs" style="left:35px;top:17px;width:7px;height:7px;border-radius:4px;background:#64748B"></i><i id="d2" class="abs" style="left:50px;top:17px;width:7px;height:7px;border-radius:4px;background:#64748B"></i></div>
      <div class="bub" id="jrB" style="left:${493 - 418}px;top:${1216 - 556}px;background:#F1F5F9;color:#0F172A;transform-origin:0 0">Ayo! Aku juga lagi di sekitar Blok M, ketemuan aja.</div>
    </div>
  </div>
`);

const qb = quote('qBook', 36.5, 39.5, ['Ingin liburan lebih', 'aman dan nyaman?'], ['Cuss langsung aja', 'booking <span class="k" id="qbK">tourguide</span>nya!']);
const QB = [36.75, 37.0, 38.4, 38.65], QBO = [38.05, 38.1];

add(bk.world, `<div class="abs" id="vLine" style="left:906px;top:643px;width:332px;height:3px;border-radius:2px;background:#0F172A;transform-origin:0 50%"></div>
<div class="abs" id="modal" style="left:452px;top:660px;width:376px;height:300px;background:#fff;border:1px solid #E2E8F0;border-radius:20px;box-shadow:0 24px 60px rgba(15,23,42,.18)">
  <svg class="abs" viewBox="0 0 64 64" style="left:156px;top:34px;width:64px;height:64px"><circle cx="32" cy="32" r="29" fill="none" stroke="#35A8FF" stroke-width="4" stroke-dasharray="183" id="okRing"/><path d="M19 33l9 9 17-19" fill="none" stroke="#35A8FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" id="okTick"/></svg>
  <div class="t" style="left:0;width:376px;text-align:center;top:116px;font-size:24px;font-weight:800;letter-spacing:-.02em"><span class="m" id="mo0"><span class="mi">Booking berhasil!</span></span></div>
  <div class="t" style="left:0;width:376px;text-align:center;top:158px;font-size:15px;font-weight:600"><span class="m" id="mo1"><span class="mi">Rihana Komeng · Labuan Bajo, NTT</span></span></div>

  <div class="abs" id="moP" style="left:68px;top:226px;width:240px;height:40px;border-radius:20px;background:#F1F5F9;font-size:13px;font-weight:700;line-height:40px;text-align:center;color:#0F172A">${svg('check', 'width:15px;height:15px;vertical-align:-3px;margin-right:6px;fill:none;stroke:#0F172A;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round')}Terverifikasi tim Kelana</div>
</div>`);

/* ======================= W7 PROBLEM (screen space, navy) ======================= */
const pb = win('problem', 44.5, 48.0, { screen: true, bg: '#0E4673' });
add(pb.world, `
  <div class="t" style="left:160px;top:330px;font-size:20px;font-weight:700;letter-spacing:.16em;color:#9CC9EE"><span class="m" id="pe"><span class="mi">SEMENTARA ITU, PEMANDU LOKAL…</span></span></div>
  <div class="pr" style="left:160px;top:384px"><span class="m" id="p0"><span class="mi">Susah ketemu wisatawan,</span></span></div>
  <div class="pr" style="left:160px;top:476px"><span class="m" id="p1"><span class="mi">pendapatan ikut turun.</span></span></div>
