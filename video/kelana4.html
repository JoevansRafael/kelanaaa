<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<style>

.win{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#F8FAFC}

.spr{position:absolute;background-repeat:no-repeat}
.patch{position:absolute}
.m{overflow:hidden;display:inline-block;vertical-align:top;padding:0 .05em .16em;margin:0 -.05em -.16em}

.q{position:absolute;font-size:104px;font-weight:800;letter-spacing:-.045em;line-height:1}
.k{color:#35A8FF}
.pr{position:absolute;color:#fff;font-weight:800;letter-spacing:-.04em;line-height:1.08;font-size:84px}
.rw{position:absolute;width:540px;height:340px;background:#fff;border:1px solid #E2E8F0;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.16);overflow:hidden;transform-origin:50% 50%}
.rw .bar{position:absolute;left:0;top:0;width:540px;height:38px;background:#F1F5F9;border-bottom:1px solid #E2E8F0}
.rw .dot{position:absolute;top:15px;width:9px;height:9px;border-radius:5px;background:#CBD5E1}
.rw .url{position:absolute;left:72px;top:8px;width:330px;height:22px;border-radius:11px;background:#fff;font-size:12px;line-height:22px;color:#64748B;padding-left:12px;white-space:nowrap}
.rw .ttl{position:absolute;left:20px;top:52px;width:500px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.22}

.rw .st{position:absolute;font-size:15px;color:#F5A524;letter-spacing:2px}
.stp{position:absolute;top:0;height:26px;font-size:14.5px;font-weight:700;line-height:26px;white-space:nowrap;padding-left:34px}

<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="fCur" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCur" stdDeviation="0 0"/></filter>
  <filter id="fCard" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCard" stdDeviation="0 0"/></filter>

</svg>
<div id="stage"></div>

<script>
'use strict';
/* =====================================================================
   Kelana explainer v4 — 75 s, 120 BPM. Pure function of t in seek(t).
   Pages are the Figma exports (1 world unit = 1 px of a 1280-wide page).
   Moving parts are vector layers or sprites cut from the same export.
   ===================================================================== */
const DUR = 75;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, t0, d) => clamp((t - t0) / d);
const E = {
  lin: p => p,
  expo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  expoIn: p => (p <= 0 ? 0 : (Math.pow(2, 10 * p) - 1) / 1023),
  expoio: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  inout: p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  in: p => p * p * p,
  spring: p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-8 * p) * (Math.cos(7.06 * p) + (8 / 7.06) * Math.sin(7.06 * p))),
};
const SPR = E.spring;
const bump = (t, t0, up = .1, down = .3) => (t < t0 ? 0 : t < t0 + up ? E.expo((t - t0) / up) : 1 - E.inout(seg(t, t0 + up, down)));
const $ = id => document.getElementById(id);
const add = (el, s) => el.insertAdjacentHTML('beforeend', s);
const IC = {
  camera: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8.5 7l1.5-3h4l1.5 3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  route: '<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
  check: '<path d="M6 12.5l4 4 8-9"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-4 4.2-6 7.5-6s6.3 2 7.5 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
};
const svg = (n, st) => `<svg viewBox="0 0 24 24" style="${st}">${IC[n]}</svg>`;

/* ---------- windows (one per screen); each has its own camera ---------- */
const WINS = {};   // id -> {el, world, t0, t1, cam:[...], origin}
const ORDER = [];
function win(id, t0, t1, opts = {}) {
  add($('stage'), `<div class="win" id="w_${id}"><div class="world" id="wd_${id}"></div></div>`);
  const w = { id, t0, t1, el: $('w_' + id), world: $('wd_' + id), cam: null, screen: !!opts.screen, img: opts.img, bg: opts.bg };
  if (opts.img) add(w.world, `<img class="page" src="assets/scr/${opts.img}.jpg">`);
  if (opts.screen) { w.world.style.width = '1920px'; w.world.style.height = '1080px'; }
  if (opts.bg) w.el.style.background = opts.bg;
  WINS[id] = w; ORDER.push(w); return w;
}
const spr = (img, x, y, w, h, id = '', extra = '') => `<div class="spr" ${id ? `id="${id}"` : ''} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(assets/scr/${img}.jpg);background-size:1280px auto;background-position:${-x}px ${-y}px;${extra}"></div>`;
const patch = (x, y, w, h, c, id = '', extra = '') => `<div class="patch" ${id ? `id="${id}"` : ''} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};${extra}"></div>`;

/* ======================= W0 HOOK (screen space) ======================= */
const hook = win('hook', 0, 8.0, { screen: true });
// research windows piling up ("riset 40 tab browser" is Kelana's own copy)
const RWS = [ // title, search text, kind, photo, dx, dy, rot
  ['Pantai tersembunyi di Bali yang wajib dikunjungi', 'pantai tersembunyi bali', 'photo', 'r_bali', -230, -210, -4],
  ['Harga kapal ke Labuan Bajo berapa sih?', 'harga kapal labuan bajo', 'qa', null, 150, -240, 3],
  ['Itinerary Bromo 3 hari 2 malam', 'itinerary bromo 3h2m', 'photo', 'r_bromo', -60, -70, -2],
  ['Homestay dekat Pink Beach, ada rekomendasi?', 'homestay pink beach', 'rev', null, 230, -30, 4],
  ['Rute Jogja ke Borobudur naik apa?', 'rute jogja borobudur', 'photo', 'r_borobudur', -250, 120, 3],
  ['Budget ke Raja Ampat realistisnya berapa?', 'budget raja ampat', 'photo', 'r_raja', 110, 150, -3],
  ['Cuaca Danau Toba bulan Desember', 'cuaca danau toba desember', 'photo', 'r_toba', -110, 250, 2],
  ['Jam buka tempat wisata di Jogja', 'jam buka wisata jogja', 'rev', null, 210, 260, -5],
];
const RW_T = [0, .5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5], TABS = [3, 8, 13, 19, 24, 30, 35, 40];
RWS.forEach(([ttl, q, kind, ph, dx, dy, rot], i) => {
  let body = '';
  if (kind === 'photo') body = `<img class="ph" src="assets/hook/${ph}.jpg"><div class="sk" style="left:20px;top:282px;width:460px"></div><div class="sk" style="left:20px;top:304px;width:380px"></div>`;
  else if (kind === 'qa') body = [0, 1, 2, 3].map(k => `<div class="av" style="left:20px;top:${118 + k * 52}px"></div><div class="sk" style="left:62px;top:${122 + k * 52}px;width:${300 - k * 30}px"></div><div class="sk" style="left:62px;top:${138 + k * 52}px;width:${400 - k * 40}px;height:8px"></div>`).join('');
  else body = [0, 1, 2, 3].map(k => `<div class="st" style="left:20px;top:${116 + k * 52}px">${'★★★★★☆☆'.slice(k % 2, 5 + (k % 2))}</div><div class="sk" style="left:20px;top:${140 + k * 52}px;width:${470 - k * 50}px"></div>`).join('');
  add(hook.world, `<div class="rw" id="rw${i}" style="left:${1400 - 270 + dx}px;top:${540 - 170 + dy}px">
    <div class="bar"><i class="dot" style="left:16px"></i><i class="dot" style="left:31px"></i><i class="dot" style="left:46px"></i><div class="url"><svg viewBox="0 0 24 24" style="width:12px;height:12px;vertical-align:-2px;margin-right:6px;fill:none;stroke:#64748B;stroke-width:2.6;stroke-linecap:round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>${q}</div></div>
    <div class="ttl">${ttl}</div>${body}</div>`);
});
add(hook.world, `<div class="t" id="tabc" style="left:140px;top:742px;font-size:30px;font-weight:700;color:#64748B"><span class="m"><span class="mi"><span id="tabn">3</span> tab riset terbuka</span></span></div>`);
const HW = [ // word, line, in, out
  ['Mau', 0, .5, 4.0], ['liburan,', 0, .75, 4.03], ['tapi', 1, 1.25, 4.06], ['malah', 1, 1.5, 4.09], ['<span class="k">bingung?</span>', 2, 2.0, 4.12],
  ['Ujung-ujungnya', 3, 4.5, 6.2], ['malah', 4, 5.0, 6.25], ['gajadi', 4, 5.25, 6.3], ['<span id="lib">liburan?</span>', 4, 5.5, 6.35],
  ['Dibuat', 5, 6.5, 7.75], ['gampang', 5, 6.75, 7.8], ['di', 6, 7.0, 7.8], ['<span id="hlogoSlot" style="display:inline-block;width:326px;height:96px"></span>', 6, 7.25, null], ['aja!', 6, 7.25, 7.85],
];
const HL = [[140, 300, 112], [140, 424, 112], [140, 548, 112], [216, 372, 118], [216, 508, 118], [216, 372, 118], [216, 508, 118]];
{
  let h = '';
  HL.forEach(([x, y, fs], L) => {
    h += `<div class="hook" style="left:${x}px;top:${y}px;font-size:${fs}px" id="hl${L}">` + HW.map((w, i) => w[1] === L ? `<span class="m" id="hw${i}"><span class="mi">${w[0]}</span></span> ` : '').join('') + '</div>';
  });
  add(hook.world, h);
  add(hook.world, `<div class="abs" id="strike" style="height:10px;background:#0F172A;border-radius:5px;transform-origin:0 50%"></div>`);
}
add($('top'), `<img id="hlogo" src="assets/logo.png" style="position:absolute;left:0;top:0;width:326px;transform-origin:0 0;display:none">`);

/* ======================= W1 LANDING ======================= */
const landing = win('landing', 8.0, 15.5, { img: 'landing' });

/* ======================= W2 SUSUN 1 ======================= */
const s1 = win('susun1', 15.5, 19.5, { img: 'susun1' });
add(s1.world, `
  <div class="abs" id="pasCover" style="left:324px;top:763px;width:252px;height:151px;background:#fff">
    <div class="tile" style="left:3px;top:3px;width:246px;height:145px"></div>
    <div class="ibox" style="left:24px;top:24px">${svg('heart', '')}</div>
    <div class="t" style="left:24px;top:77px;font-size:15px;font-weight:700">Pasangan</div>
    <div class="t" style="left:24px;top:110px;font-size:13px;color:#64748B">2 orang</div>
  </div>
  ${patch(60, 1036, 784, 34, '#fff')}
  <div class="abs" style="left:67px;top:1049px;width:770px;height:6px;border-radius:3px;background:#E8EEF5"></div>
  <div class="abs" id="knob" style="left:0;top:1044px;width:22px;height:22px;margin-left:-11px;border-radius:11px;background:#35A8FF;border:3px solid #fff;box-shadow:0 1px 4px rgba(15,23,42,.25)"></div>
  ${patch(690, 996, 150, 34, '#fff')}
  <div class="t" id="bVal" style="right:${1280 - 835}px;top:999px;font-size:19px;font-weight:700;color:#2B8EDB">Rp 9,00 jt</div>
`);

/* ======================= W3 SUSUN 2 ======================= */
const s2 = win('susun2', 19.5, 23.5, { img: 'susun2' });
const TILE2 = [
  ['c0', 327, 363, 'camera', 'Pemandangan alam', 'Bukit,  pantai, air terjun'],
  ['c1', 327, 521, 'sun', 'Sunrise & sunset', 'Siap bangun subuh'],
  ['c2', 589, 521, 'compass', 'Snorkeling Laut', 'Terumbu, pulau kecil'],
];
TILE2.forEach(([id, x, y, ic, a, b]) => add(s2.world, `<div class="abs" id="${id}" style="left:${x - 3}px;top:${y - 3}px;width:252px;height:151px;background:#fff">
  <div class="tile" style="left:3px;top:3px;width:246px;height:145px"></div>
  <div class="ibox" style="left:24px;top:24px">${svg(ic, '')}</div>
  <div class="t" style="left:24px;top:76px;font-size:15px;font-weight:700">${a}</div>
  <div class="t" style="left:24px;top:109px;font-size:13px;color:#64748B">${b}</div></div>`));
add(s2.world, `<div class="abs" id="c3" style="left:62px;top:890px;width:776px;height:85px;background:#fff">
  <div class="tile" style="left:3px;top:3px;width:770px;height:79px;border-radius:12px"></div>
  <div class="abs" style="left:24px;top:19px;width:48px;height:48px;border-radius:10px;background:#EEF2F6;display:flex;align-items:center;justify-content:center">${svg('route', 'width:22px;height:22px;fill:none;stroke:#334155;stroke-width:1.8;stroke-linecap:round')}</div>
  <div class="t" style="left:81px;top:25px;font-size:14.5px;font-weight:700">Seimbang 4–5 aktivitas sehari</div>
  <div class="t" style="left:81px;top:46px;font-size:12.5px;color:#64748B">Cukup padat tapi masih ada jeda</div></div>
  ${patch(920, 570, 64, 34, '#fff', 'k0')}${patch(984, 570, 96, 34, '#fff', 'k2')}${patch(1080, 570, 80, 34, '#fff', 'k1')}
  ${patch(1120, 536, 96, 22, '#fff', 'k3')}`);
const PICK_T = [20.5, 21, 21.5, 22.5];

/* ======================= LOADING (screen space) ======================= */
const ld = win('loading', 23.5, 25, { screen: true });
add(ld.world, `
  <svg class="abs" id="spin" viewBox="0 0 100 100" style="left:${960 - 52}px;top:${430 - 52}px;width:104px;height:104px">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#E2E8F0" stroke-width="9"/>
    <circle id="spinArc" cx="50" cy="50" r="40" fill="none" stroke="#35A8FF" stroke-width="9" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="180"/>
  </svg>
  <div class="t" style="left:0;width:1920px;text-align:center;top:528px;font-size:52px;font-weight:800;letter-spacing:-.035em"><span class="m" id="ld0"><span class="mi">Lagi nyusun rencanamu…</span></span></div>
  <div class="t" style="left:0;width:1920px;text-align:center;top:604px;font-size:24px;color:#64748B"><span class="m" id="ld1"><span class="mi">Hitung waktu tempuh, jam buka & biaya per pos</span></span></div>
  <div class="abs" style="left:${960 - 240}px;top:668px;width:480px;height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden" id="ldTrack"><div class="abs" id="ldBar" style="left:0;top:0;height:8px;width:480px;background:#0F172A;transform-origin:0 50%"></div></div>
`);

/* ======================= W4 SUSUN 3 (+ drag & drop) ======================= */
const s3 = win('susun3', 25, 31.5, { img: 'susun3' });
const COST = [[2.09, '#35A8FF'], [.92, '#3B7FC4'], [.78, '#FF7A45'], [.63, '#F5A524'], [.435, '#CBD5E1']];
add(s3.world, `
  ${patch(920, 337, 300, 19, '#fff')}
  <div class="abs" id="eTrack" style="left:925px;top:341px;width:290px;height:11px;border-radius:6px;background:#E8EEF5;overflow:hidden">${COST.map((c, i) => `<div class="abs" id="seg${i}" style="top:0;height:11px;background:${c[1]}"></div>`).join('')}</div>
  ${patch(1080, 300, 140, 36, '#fff')}
  <div class="t" id="eTot" style="right:${1280 - 1214}px;top:302px;font-size:23px;font-weight:800;letter-spacing:-.02em">Rp 0,00 jt</div>
  ${patch(120, 616, 330, 26, '#EAF4FE', 'actCover')}
  <div class="t" style="left:125px;top:619px;font-size:14px;color:#64748B">Kam, 13 Nov · <span class="m"><span class="mi" id="actN">4 aktivitas · 11 jam 30 menit</span></span></div>
  ${patch(0, 1066, 880, 533, '#F8FAFC')}
  ${spr('susun3', 30, 1198, 840, 74, 'sTambah')}
  <div class="abs" id="sWarnClip" style="left:30px;top:1290px;width:840px;height:192px;overflow:hidden">${spr('susun3', 30, 1290, 840, 192, '', 'left:0;top:0')}</div>
  ${spr('susun3', 30, 1500, 840, 72, 'sBtns')}
  ${spr('susun3', 36, 1068, 830, 130, 'sManta', 'border-radius:16px')}
`);
document.querySelector('#sWarnClip .spr').style.backgroundPosition = '-30px -1290px';

/* ======================= INTERSTITIALS (screen space) ======================= */
function quote(id, t0, t1, a, b) {
  const w = win(id, t0, t1, { screen: true });
  const L = (txt, y, k) => `<div class="q" style="left:216px;top:${y}px"><span class="m" id="${id}_${k}"><span class="mi">${txt}</span></span></div>`;
  add(w.world, L(a[0], 400, 0) + L(a[1], 524, 1) + L(b[0], 400, 2) + L(b[1], 524, 3));
  return w;
}
const qf = quote('qForum', 31.5, 34.5, ['Butuh review atau', 'pengalaman orang lain?'], ['Tenang, kamu bisa', 'ngobrol di <span class="k" id="qfK">forum!</span>']);
const QF = [31.75, 32, 33.4, 33.65], QFO = [33.05, 33.1];

/* ======================= W5 FORUM ======================= */
const fo = win('forum', 34.5, 40.5, { img: 'forum' });
add(fo.world, `
  ${patch(440, 1146, 700, 30, '#F8FAFC', 'fCover')}
  <div class="t" id="fType" style="left:446px;top:1151px;font-size:15px"></div>
  ${patch(418, 556, 826, 556, '#fff', 'chatPatch')}
  <div class="abs" id="chatClip" style="left:418px;top:556px;width:826px;height:556px;overflow:hidden">
    <div class="abs" id="chatMove" style="left:0;top:0;width:826px;height:900px">
      ${spr('forum', 418, 556, 826, 556, '', 'left:0;top:0')}

/* =====================================================================
   Cameras
   ===================================================================== */
function camTrack(start, moves) { return { start, moves }; }
function camEval(tr, t) {
  let s = { ...tr.start };
  for (const [a, b, cx, cy, z, e] of tr.moves) {
    if (t >= b) { s = { cx, cy, z }; continue; }
    if (t > a) { const q = E[e || 'inout']((t - a) / (b - a)); s = { cx: lerp(s.cx, cx, q), cy: lerp(s.cy, cy, q), z: lerp(s.z, z, q) }; }
    break;
  }
  return s;
}
function camAt(w, t) {
  if (w.screen) { const P = Math.pow(1.04, clamp((t - w.t0) / (w.t1 - w.t0))); return { cx: 960, cy: 540, z: 1, Z: P }; }
  const c = camEval(w.cam, t); c.Z = c.z * Math.pow(1.04, clamp((t - w.t0) / (w.t1 - w.t0))); return c;
}
const proj = (w, x, y, t) => { const c = camAt(w, t); return [960 + (x - c.cx) * c.Z, 540 + (y - c.cy) * c.Z]; };

    if (ci >= 0) {
      const c = CAPS[ci], prevEnd = ci > 0 ? CAPS[ci - 1][1] : -9, fresh = c[0] - prevEnd > .3;
      const k = SPR(seg(t, c[0] - .1, .65));
      W = fresh ? G.capW[ci] * k : lerp(G.capW[ci - 1], G.capW[ci], k);
      const last = ci === CAPS.length - 1 || CAPS[ci + 1][0] - c[1] > .3;
      if (last) W *= 1 - E.expoIn(seg(t, c[1] + .05, .35));
    }
    const pill = $('cap'); pill.style.width = W + 'px'; pill.style.display = W > 1 ? '' : 'none';
    $('capt').style.display = pill.style.display;
  }

  /* ---- cursor ---- */
  {
    const cu = $('cur'), on = CUR_WIN.some(([a, b]) => t >= a && t < b);
    cu.style.display = on ? '' : 'none';
    if (on) {

      const pr = PRESS.reduce((m, [a, b]) => Math.max(m, t < a ? 0 : t < b ? E.expo(seg(t, a, .06)) : 1 - E.expo(seg(t, b, .12))), 0);
      cu.style.transform = `translate(${x - 3}px,${y - 3}px) scale(${1 - .16 * pr})`;
      const [px, py] = curAt(t - 1 / 60);
      setBlur('fCur', 'gCur', cu, Math.min(Math.abs(x - px) * BL, 12), Math.min(Math.abs(y - py) * BL, 12));
    }
  }
};
